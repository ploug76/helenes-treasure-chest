<script>
'use strict';
const $=i=>document.getElementById(i);
const app=$('app'),cv=$('cv'),cx=cv.getContext('2d'),wrap=$('wrap');
const SAVEK='htc_save_v1',URL0='https://ploug76.github.io/helenes-treasure-chest/';
const MOVES=30,RUSH=120;
let SV={classic:null,zen:null,best:{classic:0,rush:0,zen:0},muted:false};
try{const s=JSON.parse(localStorage.getItem(SAVEK));if(s)SV=Object.assign(SV,s);SV.best=Object.assign({classic:0,rush:0,zen:0},SV.best||{})}catch(e){}
let muted=!!SV.muted;

/* ---------- state ---------- */
let state='title';            // 'title' | 'play' | 'pause' | 'levelup' | 'over' | 'howto'
let G=null,B=newBoard(),busy=false,sel=null,hint=null,lastAct=performance.now(),cell=40,DPR=1,BS=320;
const fading=[],parts=[],fx=[],floats=[];
/* Classic is tuned to stay fun, never a wall: about 95%+ winnable with random play for levels 1-10, settling near 80% (93% with one free +5) after that. See qa sim3.js */
function goalFor(mode,L){return mode==='zen'?140+10*Math.min(L,12):L<=5?100+8*L:L<=10?140+6*(L-5):Math.min(170+5*(L-10),215)}
function ncFor(mode,L){return 6}

function ppu(){return G&&G.mode==='classic'?10*G.level:10}
/* ---------- layout (runs on load, resize, rotation and keyboard/zoom changes) ---------- */
let LW=0,LH=0;

 if(!W||!H)return;if(!force&&W===LW&&H===LH)return;LW=W;LH=H;
 app.style.width=W+'px';app.style.height=H+'px';const s=safe(),land=W>H*1.08;app.classList.toggle('land',land);app.classList.toggle('short',H<620||(land&&H<520));
 const top=$('top'),ctl=$('ctl'),P=8,FR=14;let bs,bx,by;
 if(!land){const w=W-s.l-s.r-2*P;top.style.width=w+'px';top.style.left=(s.l+P)+'px';top.style.top=(s.t+P)+'px';
  const th=top.offsetHeight,ch=ctl.offsetHeight||58;ctl.style.left=(s.l+P)+'px';ctl.style.width=w+'px';ctl.style.top='';ctl.style.flexDirection='row';
  const avail=H-s.t-s.b-th-ch-4*P;bs=Math.floor(Math.min(w,avail)-FR);bs=Math.max(160,bs);
  const tot=th+P+bs+FR+P+ch,y0=Math.round(s.t+Math.max(P,(H-s.t-s.b-tot)/2));top.style.top=y0+'px';bx=Math.round((W-bs-FR)/2);by=y0+th+P;
  ctl.style.top=(by+bs+FR+P)+'px'}
 else{bs=Math.floor(H-s.t-s.b-2*P-FR);const pw=Math.min(520,W-s.l-s.r-bs-FR-3*P);if(pw<230)bs=Math.floor(W-s.l-s.r-230-3*P-FR);
  const pw2=Math.min(520,W-s.l-s.r-bs-FR-3*P),tot=bs+FR+P+pw2,x0=Math.round(s.l+(W-s.l-s.r-tot)/2);bx=x0;by=Math.round(s.t+(H-s.t-s.b-bs-FR)/2);
  top.style.width=pw2+'px';top.style.left=(x0+bs+FR+P)+'px';ctl.style.width=pw2+'px';ctl.style.left=top.style.left;
  const th=top.offsetHeight,ch=ctl.offsetHeight||58,gap=Math.max(P,(H-s.t-s.b-th-ch)/3);top.style.top=Math.round(s.t+gap)+'px';ctl.style.top=Math.round(s.t+gap+th+gap)+'px'}
 wrap.style.left=bx+'px';wrap.style.top=by+'px';BS=bs;cell=bs/N;DPR=Math.min(3,window.devicePixelRatio||1);
 cv.style.width=bs+'px';cv.style.height=bs+'px';cv.width=Math.round(bs*DPR);cv.height=Math.round(bs*DPR);clearSprites();

 const ch=$('chest'),tc=$('titleCard'),T=['tight','tight2','tight3'];T.forEach(c=>app.classList.remove(c));let cw=app.classList.contains('short')?200:250,lv=0;const cs=()=>{ch.style.width=cw+'px';ch.style.height=Math.round(cw*.56)+'px'};cs();
 for(let i=0;i<16&&tc.scrollHeight>tc.clientHeight+1;i++){if(cw>120){cw-=20;cs()}else if(lv<T.length){app.classList.add(T[lv++])}else break}}/* fit title card on short phones so Share/Scores show without scrolling */

let AC=null,MG=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,t0,dur,type,vol,f2){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);

const SC=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760];
const SND={sel(){tone(1046,0,.09,'sine',.06)},swap(){tone(600,0,.13,'triangle',.05,900)},bad(){tone(330,0,.16,'sine',.1,290);tone(262,.13,.22,'sine',.09,240)},
 match(c){const f=SC[Math.min(c-1,SC.length-1)];bell(f,0,.12);bell(f*1.25,.07,.06)},make(){[0,1,2,3].forEach(i=>bell(SC[i*2]*1,i*.06,.06))},
 line(){tone(500,0,.35,'triangle',.06,1700);tone(1000,.05,.3,'sine',.04,2400)},burst(){tone(180,0,.5,'sine',.2,60);tone(90,0,.4,'triangle',.08,45)},
 star(){for(let i=0;i<10;i++)bell(SC[i],i*.04,.05)},level(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*.14,.12));bell(1318.5,.6,.1)},

/* ---------- tweens ---------- */
const tweens=[];const EASE={lin:p=>p,out:p=>1-(1-p)*(1-p),in:p=>p*p,io:p=>p<.5?2*p*p:1-2*(1-p)*(1-p),back:p=>{const s=1.7;p=p-1;return p*p*((s+1)*p+s)+1}};
function tween(o,to,dur,ease){return new Promise(res=>{const from={};for(const k in to)from[k]=o[k];tweens.push({o,from,to,dur:Math.max(1,dur),t0:performance.now(),e:EASE[ease||'out'],res})})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stepTweens(t){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i],p=Math.min(1,(t-w.t0)/w.dur),e=w.e(p);for(const k in w.to)w.o[k]=w.from[k]+(w.to[k]-w.from[k])*e;if(p>=1){tweens.splice(i,1);w.res()}}}
/* ---------- particles / effects ---------- */
function sparkle(r,c,col,n){const x=(c+.5)*cell,y=(r+.5)*cell;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(.6+Math.random()*1.6)*cell/360;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cell/1400,life:500+Math.random()*450,t:0,s:cell*(.09+Math.random()*.12),col:Math.random()<.4?'#ffffff':(col>=0?PAL[col][0]:'#fff6b0'),rot:Math.random()*3})}}

function renderList(rows,meRank,meRow){const ul=$('ol',{id:'palbList'});const me=pid();

const SRC={online:'🌐 Live scores from everyone',offline:'📴 Offline — showing scores saved on this phone',local:'📱 Scores saved on this phone'};
async function show(b,opts={}){build();b=b||lastShown||(G.boards&&G.boards[0]&&G.boards[0].id)||'main';lastShown=b;

/* Game over: ask for a name (remembered), save, then show the board with the player highlighted. */
async function gameOver(score,o={}){if(!G)return;build();score=Math.round(+score);const b=o.board||(G.boards&&G.boards[0]&&G.boards[0].id)||'main';
  if(!sane(score)||(G.order==='desc'&&score<=0&&!G.allowZero))return null;const pv=o.best!=null?Math.round(+o.best):score;if(!sane(pv))return null;
  if(o.ask===false&&!LS.getItem(NAMEK))return null;
  const pbK='pa_lb_pb:'+boardId(b),pb=jget(pbK,null),isPB=pb==null||better(score,pb);
  lastShown=b;head(o.heading||G.overTitle||'GAME OVER',G.title+(boardLabel(b)?' · '+boardLabel(b):''));
  card.append($('div',{},o.label||'Your score'),$('div',{class:'big'},fmt(score)),$('div',{class:'note'},o.best!=null?(o.label?'':'Best: '+fmt(pv)+(o.newBest?'  ★ New best! ★':'')):isPB?(pb==null?'':'★ New personal best! ★'):'Your best: '+fmt(pb)));
  const inp=$('input',{type:'text',maxlength:'12',autocomplete:'nickname',autocapitalize:'words',spellcheck:'false',enterkeyhint:'done',placeholder:'Your name','aria-label':'Your name for the leaderboard'});inp.value=LS.getItem(NAMEK)||'';

  card.append($('div',{style:'font-size:13px;margin-top:4px'},'Name for the leaderboard:'),inp,err);const row=$('div',{class:'row2'});row.append(skip,save);card.append(row);
  openOv();if(!inp.value)setTimeout(()=>{try{inp.focus()}catch(e){}},50);

    tapBtn(skip,()=>{close();res({skipped:true})});
    const go=async()=>{if(busy)return;const n=cleanName(inp.value);inp.value=n;const m=nameError(n);if(m){err.textContent=m;return}
      busy=true;save.disabled=skip.disabled=true;LS.setItem(NAMEK,n);try{inp.blur()}catch(e){}
      const sent=await post(pv,b,n),e={pid:pid(),name:n,score:pv};
      const r=await show(b,{title:'🏆 TOP 10',mine:e});chime(r&&r.rank&&r.rank<=10);

      res({saved:true,sent,rank:r&&r.rank})};
    tapBtn(save,go);inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();go()}})})}

async function post(score,b,name){const e={pid:pid(),name,score,ts:Date.now()},id=boardId(b);await Local.submit(id,e);
  const pbK='pa_lb_pb:'+id,pb=jget(pbK,null);if(pb==null||better(score,pb))jset(pbK,score);
  if(REMOTE){try{await withTimeout(REMOTE.submit(id,e));const pk='pa_lb_posted:'+id,pp=jget(pk,null);if(pp==null||better(score,pp))jset(pk,score);return true}catch(x){const q=jget(QK,[]);q.push({b:id,e});jset(QK,q.slice(-30))}}return false}
/* silent: post in the background once the player has a saved name (level-based games, so no popup after every level) */
async function submitQuiet(score,o={}){if(!G)return;score=Math.round(+score);const b=o.board||(G.boards&&G.boards[0]&&G.boards[0].id)||'main';
  if(!sane(score)||(G.order==='desc'&&score<=0&&!G.allowZero))return null;const n=LS.getItem(NAMEK);if(!n)return gameOver(score,o);
  const pb=jget('pa_lb_pb:'+boardId(b),null);if(pb!=null&&!better(score,pb))return{kept:true};return{sent:await post(score,b,n),quiet:true}}
/* game's own saved best (G.best expression) feeds the board */
const defBoard=()=>(G.boards&&G.boards[0]&&G.boards[0].id)||'main';
function localBest(){if(!G.bestF)return null;let v;try{v=Math.round(+G.bestF())}catch(e){return null}return sane(v)&&(v>0||G.allowZero)?v:null}
function unposted(b){const B=localBest();if(B==null)return null;const P=jget('pa_lb_posted:'+boardId(b),null);if(!REMOTE){const L=jget('pa_lb_pb:'+boardId(b),null);return L==null||better(B,L)?B:null}return P==null||better(B,P)?B:null}
async function syncBest(reason){if(!G||open)return;const b=defBoard(),B=unposted(b);if(B==null)return false;const n=LS.getItem(NAMEK);
  if(n){await post(B,b,n);return true}
  const AK='pa_lb_asked:'+boardId(b);if(reason==='load'&&jget(AK,null)===B)return false;jset(AK,B);
  await gameOver(B,{board:b,best:B,label:'Your best on this phone',heading:'🏆 SHARE YOUR BEST'});return true}
async function tapShow(){if(G&&G.bestF){const B=unposted(defBoard());if(B!=null&&!LS.getItem(NAMEK)){await syncBest('tap');return}if(B!=null)await post(B,defBoard(),LS.getItem(NAMEK))}return show()}
async function bestOver(score){const b=defBoard(),B=localBest();if(B==null||unposted(b)==null)return;const n=LS.getItem(NAMEK);
  if(!n)return gameOver(score,{board:b,best:B,newBest:B===score});const sent=await post(B,b,n);
  const r=await show(b,{mine:{pid:pid(),name:n,score:B}});chime(r&&r.rank&&r.rank<=10);
  if(r){const note=$('div',{class:'note'},'★ New best '+fmt(B)+' posted! '+(r.rank?'You\u2019re #'+r.rank+'!':sent?'':'(will post when online)'));const l=document.getElementById('palbList');l&&l.before(note)}}
/* watch: no game-code edits needed. when/score/board are JS expressions evaluated in the game's global scope. */
function watch(w){const F=s=>s==null?()=>undefined:typeof s==='function'?s:Function('try{return ('+s+')}catch(e){return undefined}');const when=F(w.when),sc=F(w.score),bd=F(w.board),ok=F(w.valid||'true');let was=false;
  setInterval(()=>{let now=false;try{now=!!when()}catch(e){}if(now&&!was&&!open){const s=sc(),b=bd()||undefined;if(ok()!==false&&s!=null&&isFinite(s))setTimeout(()=>{w.best?bestOver(s):(w.silent?submitQuiet:gameOver)(s,{board:b})},w.delay??900)}was=now},150)}
function init(o){G=Object.assign({order:'desc',unit:'pts',min:0,max:1e9,top:10,boards:null,muted:()=>{try{return typeof muted!=='undefined'&&!!muted}catch(e){return false}}},o);G.title=G.title||document.title;if(o.best)G.bestF=typeof o.best==='function'?o.best:Function('try{return ('+o.best+')}catch(e){return undefined}');

const api={init,postNow,syncBest,localBest,gameOver,submitQuiet,watch,show,close,isOpen:()=>open,get backend(){return REMOTE?REMOTE.name:'local'},_t:{cleanName,nameError,fmt,boardId,pid,keyOf}};
